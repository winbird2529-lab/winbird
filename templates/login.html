<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>เข้าสู่ระบบ | ระบบฌาปนกิจสงเคราะห์</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>

  <div class="login-card">
    <!-- Brand & Header -->
    <div class="login-header">
      <div class="brand-icon-wrapper">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
          <path d="M2 17l10 5 10-5"></path>
          <path d="M2 12l10 5 10-5"></path>
        </svg>
      </div>
      <h1>ระบบฌาปนกิจสงเคราะห์</h1>
      <p>ลงชื่อเข้าสู่ระบบเพื่อดำเนินการ</p>
    </div>

    <!-- Alert Box for feedback -->
    <div id="alertBox" class="alert-box">
      <span id="alertIcon">⚠️</span>
      <span id="alertText">ข้อความแจ้งเตือน</span>
    </div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="username">ชื่อผู้ใช้ (Username)</label>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="username" 
            name="username" 
            class="input-field" 
            placeholder="ป้อนชื่อผู้ใช้งานของคุณ" 
            required 
            autocomplete="username"
          />
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
      </div>

      <div class="form-group">
        <label for="password">รหัสผ่าน (Password)</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="input-field" 
            placeholder="ป้อนรหัสผ่าน" 
            required 
            autocomplete="current-password"
          />
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <button type="button" class="btn-toggle-password" id="togglePassword" aria-label="แสดง/ซ่อนรหัสผ่าน" onclick="togglePasswordVisibility()">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-options">
        <label class="remember-label">
          <input type="checkbox" id="rememberMe" />
          <span>จดจำการเข้าสู่ระบบ</span>
        </label>
        <a href="#" class="forgot-link" onclick="showAlert('กรุณาติดต่อผู้ดูแลระบบเพื่อรีเซ็ตรหัสผ่าน', 'danger'); return false;">ลืมรหัสผ่าน?</a>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">
        <span>เข้าสู่ระบบ</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </form>

    <!-- Footer Links -->
    <div class="login-footer">
      <div>
        ยังไม่มีบัญชีผู้ใช้งาน? <a href="/DK_fromUserPermission">ลงทะเบียน / กำหนดสิทธิ์</a>
      </div>
      <div class="home-link-wrap">
        <span>🏠</span>
        <a href="/DK_Home">กลับสู่หน้าหลัก (HOME)</a>
      </div>
    </div>
  </div>

  <script>
    // Load remembered username
    document.addEventListener("DOMContentLoaded", () => {
      const savedUser = localStorage.getItem("dk_remember_user");
      if (savedUser) {
        document.getElementById("username").value = savedUser;
        document.getElementById("rememberMe").checked = true;
      }
    });

    // Toggle show/hide password
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById("password");
      const eyeIcon = document.getElementById("eyeIcon");
      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        eyeIcon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
      } else {
        passwordInput.type = "password";
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
      }
    }

    // Show feedback alert
    function showAlert(text, type = "danger") {
      const box = document.getElementById("alertBox");
      const alertText = document.getElementById("alertText");
      const alertIcon = document.getElementById("alertIcon");
      box.className = `alert-box show alert-${type}`;
      alertIcon.textContent = type === "success" ? "✅" : "⚠️";
      alertText.textContent = text;
    }

    // Login submit action
    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const remember = document.getElementById("rememberMe").checked;
      const btn = document.getElementById("btnSubmit");

      if (!username || !password) {
        showAlert("กรุณากรอกชื่อผู้ใช้และรหัสผ่านให้ครบถ้วน", "danger");
        return;
      }

      if (remember) {
        localStorage.setItem("dk_remember_user", username);
      } else {
        localStorage.removeItem("dk_remember_user");
      }

      btn.disabled = true;
      btn.innerHTML = `<span>⏳ กำลังตรวจสอบข้อมูล...</span>`;

      try {
        let authResult = null;
        // 1. Try Flask API /api/login
        try {
          const res = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json();
          if (res.ok && data.status === "success") {
            authResult = data.user;
          } else {
            showAlert(data.message || "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง", "danger");
            btn.disabled = false;
            btn.innerHTML = `<span>เข้าสู่ระบบ</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>`;
            return;
          }
        } catch (fetchErr) {
          console.warn("Flask /api/login error, trying API_BASE fallback:", fetchErr);
          // Try API_BASE /auth/login fallback
          const fallbackHost = window.location.hostname || "192.168.1.180";
          const resB = await fetch(`http://${fallbackHost}:8000/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
          });
          const dataB = await resB.json();
          if (resB.ok && dataB.error === "0") {
            authResult = dataB.user;
          } else {
            showAlert(dataB.message || "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง", "danger");
            btn.disabled = false;
            btn.innerHTML = `<span>เข้าสู่ระบบ</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>`;
            return;
          }
        }

        if (authResult) {
          sessionStorage.setItem("dk_logged_user", JSON.stringify({
            id: authResult.id,
            username: authResult.username,
            fullname: authResult.fullname,
            empid: authResult.empid || "",
            role: authResult.role || "staff",
            permissions: authResult.permissions || [],
            loginAt: new Date().toISOString()
          }));
          showAlert(`เข้าสู่ระบบสำเร็จ ยินดีต้อนรับคุณ ${authResult.fullname || authResult.username}`, "success");
          setTimeout(() => {
            window.location.href = "/DK_Home";
          }, 800);
        }
      } catch (err) {
        console.error("Login fatal error:", err);
        showAlert("เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์", "danger");
        btn.disabled = false;
        btn.innerHTML = `<span>เข้าสู่ระบบ</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>`;
      }
    }
  </script>
</body>
</html>
