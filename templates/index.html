


<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>เลือกระบบเข้าใช้งาน</title>
  <style>
    body {
      background: linear-gradient(to bottom, #D3D3D3, #99CCFF ,#D3D3D3);
      color: rgb(17, 14, 14);
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    h1 {
      font-size: 2em;
      margin-bottom: 40px;
    }

    .profiles {
      display: flex;
      gap: 30px;
    }

    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .profile:hover {
      transform: scale(1.1);
    }

    .profile img {
      width: 120px;
      height: 120px;
      border-radius: 10px;
      background-color: gray;
    }

    .profile span {
      margin-top: 10px;
      font-size: 1rem;
    }

    .add-profile {
      background-color: gray;
      font-size: 50px;
      color: #999;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .manage-btn {
      margin-top: 40px;
      padding: 10px 20px;
      background-color: ;
      color: gray;
      border: 1px solid rgb(245, 238, 238);
      cursor: pointer;
    }

    .manage-btn:hover {
      color: white;
      border-color: white;
    }
  </style>
</head>
<body>

  <h1>เลือกระบบเข้าใช้งาน</h1>
  <div class="profiles">
    <div class="profile">
      <a href="/login">
        <img src="https://postimg.cc/bSGKW6L8?text=🙂" alt="ระบบ ฌาปนกิจ" style="display: block; margin: auto;" />
        <div style="text-align: center; margin-top: 8px;">ระบบ ฌาปนกิจ</div>
      </a>
    </div>
    
   

    <div class="profile">
      <div class="add-profile" style="width:120px;height:120px;">+</div>
      <span>เพิ่มโปรไฟล์</span>
    </div>
  </div>

  <button class="manage-btn">จัดการโปรไฟล์</button>

</body>
</html>
